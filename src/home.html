    <style>
      body {

      .container {

      }

  <body>
    <div class="container">
      <div id="connection-status" role="status" aria-live="polite"></div>
      <div id="cache-banner" class="alert alert-info text-center" hidden></div>
      <center>
        <h1 class="title">AquaSense</h1>
        <img src="../assets/animatedtank.gif" alt="Animated water tank" width="160">
        <p>
          AquaSense is an IOT based Liquid Level Monitoring system
          that has mechanisms to keep the user alerted in case of liquid
          overflow or when tank depletes.
        </p>
      </center>
      <div class="row">
        <div class="col-lg-3">

            style="width: 200px;height:200px; float:left"

        <div class="col-lg-3">

          ></div>
          <h2>Tank 2</h2>
        </div>
        <div class="col-lg-3">
          <div
            class="tank3"
            style="width: 200px;height:200px; float:left"
          ></div>
          <h2>Tank 3</h2>
        </div>
        <div class="col-lg-3">
          <div
            class="tank4"
            style="width: 200px;height:200px; float:left"
          ></div>
          <h2>Tank 4</h2>
        </div>

    <div class="container">
      <div class="row">
        <div
          class="col-lg-4"
          style="background-color: #fe5e21;min-height: 100px;min-width: 100px; "
        >
          <h1>Danger Zone</h1>
        </div>
        <div
          class="col-lg-4"
          style="background-color: #ffb30c;min-width: 100px;min-height: 100px"
        >
          <h1>Warning Zone</h1>
        </div>
        <div
          class="col-lg-4"
          style="background-color: #2ed351;min-width: 100px;min-height: 100px"
        >
          <h1>Safe Zone</h1>
        </div>
      </div>
      <hr />
      <p>
        <center>
          <strong>Crafted by AARVAK-VSET</strong>
          <br />
          <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">
            <img src="../assets/linkedin.png" alt="LinkedIn" width="96" height="96" loading="lazy" style="margin-top: 10px;" />
          </a>
        </center>
      </p>
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="lib/createWaterBall-jquery.js"></script>
    <script type="text/javascript" src="lib/telemetry-manager.js"></script>
    <script type="text/javascript" src="lib/telemetry-connection.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="lib/telemetry-manager.js"></script>

    <script>
      // Issue #15: exponential backoff reconnect (with jitter) for the
      // real-time telemetry stream, with connection state surfaced to the UI.
      (function () {
        var statusEl = document.getElementById("connection-status");
        var cacheBanner = document.getElementById("cache-banner");
var CACHE_KEY = "aquasense:lastSnapshot";

function saveTelemetrySnapshot(tanks) {
  try {
    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify({
        savedAt: new Date().toISOString(),
        tanks: tanks,
      })
    );
  } catch (e) {
    console.warn("Unable to save telemetry snapshot:", e);
  }
}

function loadTelemetrySnapshot() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;

    var snapshot = JSON.parse(raw);

    if (
      !snapshot ||
      typeof snapshot.savedAt !== "string" ||
      !snapshot.tanks ||
      typeof snapshot.tanks !== "object"
    ) {
      return null;
    }

    return snapshot;
  } catch (e) {
    console.warn("Unable to load telemetry snapshot:", e);
    return null;
  }
}

function showCachedBanner(savedAt) {
  if (!cacheBanner) return;

  var date = new Date(savedAt);
  if (isNaN(date.getTime())) return;

  cacheBanner.textContent =
    "Offline: showing cached data from " + date.toLocaleString();
  cacheBanner.hidden = false;
}

function hideCachedBanner() {
  if (cacheBanner) {
    cacheBanner.hidden = true;
  }
}
function renderTankLevels(tanks) {
  Object.keys(tanks).forEach(function (tankId) {
    var element = document.querySelector("." + tankId);

    if (element) {
      $(element).createWaterBall("updateRange", tanks[tankId]);
    }
  });
}
        var STATE_LABELS = {
          connecting: "Connecting to telemetry stream…",
          connected: "Live: connected to telemetry stream",
          disconnected: "Disconnected from telemetry stream",
          error: "Telemetry stream error",
        };

        function renderState(state, meta) {
          if (!statusEl) return;
          statusEl.className = "state-" + state;
          var label = STATE_LABELS[state] || state;
          if (state === "disconnected" && meta) {
            if (meta.exhausted) {
              label += " — giving up after repeated failures (" + meta.reason + ")";
            } else if (meta.retryInMs != null) {
              label +=
                " — retrying in " +
                Math.round(meta.retryInMs / 1000) +
                "s (" + meta.reason + ")";
            }
          }
          statusEl.textContent = label;
          statusEl.hidden = false;
        }
        function onLiveData(data) {
          if (!data || typeof data !== "object") return;

          var tanks = {
            tank1: Number(data.tank1),
            tank2: Number(data.tank2),
            tank3: Number(data.tank3),
            tank4: Number(data.tank4),
     };

     Object.keys(tanks).forEach(function (tankId) {
        if (!isFinite(tanks[tankId])) {
            tanks[tankId] = 0;
        }
    });

     saveTelemetrySnapshot(tanks);

     if (window.telemetryManager) {
        Object.keys(tanks).forEach(function (tankId) {
           window.telemetryManager.update(tankId, tanks[tankId]);
       });
     }
     renderTankLevels(tanks);
    hideCachedBanner();
    }
        var telemetryConnection = new TelemetryConnection({
          connect: function (onOpen, onFail) {
            var aborted = false;
            fetch("data.json")
              .then(function (res) {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
              })
              .then(function (data) {
                if (aborted) return;
                if (typeof onLiveData === "function" && Array.isArray(data)) {
                  onLiveData({
                    tank1: data[0] ? data[0].value : 0,
                    tank2: data[1] ? data[1].value : 0,
                    tank3: data[2] ? data[2].value : 0,
                    tank4: data[3] ? data[3].value : 0,
                  });
                }
                onOpen();
              })
              .catch(function (err) {
                if (!aborted) onFail(err);
              });
            return {
              close: function () {
                aborted = true;
              },
            };
          },
          onStateChange: renderState,
          onLog: function (message, err) {
            console.error(message, err);
          },
          baseDelayMs: 1000,
          maxDelayMs: 30000,
        });

        window.telemetryConnection = telemetryConnection;
        var cachedSnapshot = loadTelemetrySnapshot();

        if (cachedSnapshot) {
          renderTankLevels(cachedSnapshot.tanks);

          if (!navigator.onLine) {
            showCachedBanner(cachedSnapshot.savedAt);
          }
        }
        telemetryConnection.connect();

        window.addEventListener("online", function () {
          telemetryConnection.connect();
        });
        window.addEventListener("offline", function () {
          telemetryConnection.disconnect();
        });
      })();
    </script>

    <script>
      function playAlarm(tankId) {
        try {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          var ctx = new AudioContext();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } catch (e) {
          console.warn("Audio alarm playback error:", e);
        }
      }

      const manager = new TelemetryManager({
        onAlarm: (id) => playAlarm(id),
      });
      window.manager = manager;

      function getQueryStringValue(key) {
        return decodeURIComponent(
          window.location.search.replace(
            new RegExp(
              "^(?:.*[&\\?]" +
                encodeURIComponent(key).replace(/[\.\+\*]/g, "\\$&") +
                "(?:\\=([^&]*))?)?.*$",
              "i"
            ),
            "$1"
          )
        );
      }
      var telemetryManager = new TelemetryManager({ threshold: 20 });
      window.telemetryManager = telemetryManager;

      function playAlarmAudio(tankId) {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } catch (e) {
          console.warn("Audio alarm playback error:", e);
        }
      }

      telemetryManager.onAlarmTrigger(function(alert) {
        playAlarmAudio(alert.tankId);
      });

      var x = getQueryStringValue("tank1");
      var y = getQueryStringValue("tank2");
      var z = getQueryStringValue("tank3");
      var w = getQueryStringValue("tank4");

      var lvlX = TelemetryManager.normalizeLevel(x);
      var lvlY = TelemetryManager.normalizeLevel(y);
      var lvlZ = TelemetryManager.normalizeLevel(z);
      var lvlW = TelemetryManager.normalizeLevel(w);
      if (lvlX !== null) telemetryManager.update("tank1", lvlX);
      if (lvlY !== null) telemetryManager.update("tank2", lvlY);
      if (lvlZ !== null) telemetryManager.update("tank3", lvlZ);
      if (lvlW !== null) telemetryManager.update("tank4", lvlW);
      if (x !== "" && !isNaN(Number(x))) manager.update("tank1", Number(x));
      if (y !== "" && !isNaN(Number(y))) manager.update("tank2", Number(y));
      if (z !== "" && !isNaN(Number(z))) manager.update("tank3", Number(z));
      if (w !== "" && !isNaN(Number(w))) manager.update("tank4", Number(w));

      $(".tank1").createWaterBall({
        targetRange: x
      });
      $(".tank2").createWaterBall({
        targetRange: y
      });
      $(".tank3").createWaterBall({
        targetRange: z
});
      var loadingEle = $(".loading");
      var loading_width = loadingEle.width(),
        loading_height = loadingEle.height();
      $(".loading").createWaterBall({
        cvs_config: {
          width: loading_width,
          height: loading_height
        },
        wave_config: {
          waveWidth: 0.02,
          waveHeight: 5
        },
        data_range: [30, 70, 100],
        isLoading: true,
        nowRange: 70,
        targetRange: 70
      });
      setTimeout(function() {
        $(".loading").createWaterBall("updateRange", 80);
      }, 1000);
      $(".waterBall1").createWaterBall({
        csv_config: {
          width: $(".waterBall1").width(),
          height: $(".waterBall1").height()
        },
        wave_config: {
          waveWidth: 0.02,
          waveHeight: 5
        },
        data_range: [40, 50, 100],
        targetRange: 45
      });
    </script>
    <!-- @author: AARVAK-VSET -->
  </body>
</html>
