          // Shared Web Audio singleton and playback gate to eliminate overlapping audio distortion
          var sharedAudioContext = null;
          var isAlarmAudioPlaying = false;

          function triggerWebAudioAlarm(tankId, level) {
              if (isAlarmAudioPlaying) return; // Active alarm tone already playing
              try {
                  var AudioCtx = window.AudioContext || window.webkitAudioContext;
                  if (!AudioCtx) return;
                  sharedAudioContext = sharedAudioContext || new AudioCtx();
                  isAlarmAudioPlaying = true;

                  var osc = sharedAudioContext.createOscillator();
                  var gain = sharedAudioContext.createGain();
                  osc.type = "sine";
                  osc.frequency.setValueAtTime(880, sharedAudioContext.currentTime);
                  gain.gain.setValueAtTime(0.1, sharedAudioContext.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.001, sharedAudioContext.currentTime + 0.5);

                  osc.connect(gain);
                  gain.connect(sharedAudioContext.destination);

                  osc.onended = function () {
                      isAlarmAudioPlaying = false;
                  };

                  osc.start();
                  osc.stop(sharedAudioContext.currentTime + 0.5);
              } catch (e) {
                  isAlarmAudioPlaying = false;
              }
          }

          telemetryManager.onAlarmTrigger(function (alert) {
              console.warn("[AquaSense Alarm] Tank " + alert.tankId + " entered CRITICAL state at " + alert.level + "%");
              triggerWebAudioAlarm(alert.tankId, alert.level);
          });

          function getQueryStringValue(key) {

                          "i"
                      ),

          }
